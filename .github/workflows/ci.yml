name: Offline synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Setup and package build/install precede sandboxing and may use the network.
      - name: Install and test in isolation
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp -d /private/tmp/spotify-ci.XXXXXX)
          cp -R "$GITHUB_WORKSPACE/." "$fixture/repo"
          python -m venv "$fixture/venv"
          cd "$fixture/repo"
          PIP_CONFIG_FILE=/dev/null PIP_INDEX_URL=https://pypi.org/simple PIP_NO_CACHE_DIR=1 "$fixture/venv/bin/python" -m pip install .
          sandbox=(/usr/bin/sandbox-exec -f "$fixture/repo/.github/ci/sandbox.sb"
            -D "USER_HOME=$HOME" -D "CONFIG=$HOME/.config" -D "LIBRARY=$HOME/Library"
            -D "SSH=$HOME/.ssh" -D "CLAUDE=$HOME/.claude" -D "CODEX=$HOME/.codex")
          cleanenv=(env -i PATH="$fixture/venv/bin:/usr/bin:/bin" TMPDIR=/private/tmp PYTHONDONTWRITEBYTECODE=1)
          "${sandbox[@]}" "${cleanenv[@]}" "$fixture/venv/bin/python" -m unittest discover -s tests -v
          mkdir "$fixture/empty"
          cd "$fixture/empty"
          "${sandbox[@]}" "${cleanenv[@]}" "$fixture/venv/bin/spotify-mcp-cli" --help > /dev/null
